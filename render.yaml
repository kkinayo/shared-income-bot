services:
  - type: web
    name: shared-income-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.bot
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: DB_SSL
        value: "true"
